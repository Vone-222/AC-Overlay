<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradingView Economic Calendar</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="widget-page">
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
  {
    "colorTheme":"dark",
    "isTransparent":false,
    "locale":"en",
    "countryFilter":"au,br,ca,cn,de,eu,fr,gb,id,in,it,jp,kr,mx,ru,sa,tr,us",
    "importanceFilter":"-1,0,1",
    "width":"100%",
    "height":"100%"
  }
  </script>
</div>
</body>
</html>
